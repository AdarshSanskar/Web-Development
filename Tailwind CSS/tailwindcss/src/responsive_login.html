<!doctype html>
<html lang="en">
  s<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Login</title>
    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="min-h-lvh flex justify-center items-center bg-[#000222] px-10">
    <!-- Entire Login -->
    <div
      class="flex flex-col xl:justify-center xl:item-center xl:flex-row xl:gap-30 xl:bg-[#15173D] xl:rounded-2xl xl:py-20 xl:px-30"
    >
      <!-- Logo and Name -->
      <div
        class="flex flex-col justify-center p-5 xl:pr-30 gap-3 items-center xl:border-r-1 xl:border-[#ebc5de]"
      >
        <img
          class="hidden xl:block xl:h-30 xl:w-30 xl:min-h-30 xl:min-w-30 rounded-full"
          src="images/Logo.png"
          alt=""
        />

        <h1 class="text-5xl text-[#982598] font-bold">Login</h1>
      </div>
      <!-- Login -->
      <div
        class="flex flex-col py-20 px-10 xl:p-6 xl:pt-20 bg-[#15173D] rounded-md item-center justify-center min-w-100 max-w-md"
      >
        <!-- Username -->
        <div class="flex flex-col">
          <label
            class="text-sm xl:text-xl mb-2 font-medium text-[#982598]"
            for="username"
            >Username</label
          >
          <input
            class="block p-2 xl:p-2 xl:text-lg mb-4 xl:mb-6 text-[#450047] w-full bg-[#ebc5de] rounded-sm focus:outline-none focus:ring-2"
            type="text"
            name="username"
            id=""
            placeholder="Username"
          />
        </div>

        <!-- Password -->
        <div class="flex flex-col">
          <label
            class="text-sm xl:text-xl mb-2 font-medium text-[#982598]"
            for=""
            >Password</label
          >
          <input
            class="block p-2 mb-4 xl:p-2 xl:text-lg text-[#450047] xl:mb-6 w-full bg-[#ebc5de] rounded-sm focus:outline-none focus:ring-2"
            type="password"
            name=""
            id=""
            placeholder="Password"
          />
        </div>

        <!-- Forgot Password -->
        <div
          class="mb-4 flex item-center justify-between text-sm xl:text-lg gap-4 flex-row xl:flex-col"
        >
          <a class="hover:underline text-[#E491C9] mr-4" href=""
            >Forgot Password ?</a
          >
          <label class="flex items-center gap-3 text-[#E491C9]">
            <input class="size-5" type="checkbox" /> Remember Me
          </label>
        </div>

        <!-- Login Button -->
        <div class="flex flex-row justify-evenly gap-5">
          <button
            class="flex-1 w-1/2 bg-[#E491C9] py-1 px-4 xl:text-lg rounded-sm text-sm font-medium text-[#982598] hover:bg-[#e651b4] hover:cursor-pointer hover:text-[#690d69]"
            type="submit"
          >
            Login
          </button>
          <button
            class="flex-1 w-1/2 bg-[#E491C9] py-1 px-4 xl:text-lg rounded-sm text-sm font-medium text-[#982598] hover:bg-[#e651b4] hover:cursor-pointer hover:text-[#690d69]"
            type="submit"
          >
            Sign-Up
          </button>
        </div>

        <!-- Sign-in Google -->
        <div class="flex justify-center item-center m-5 pt-5">
          <button
            class="flex flex-row justify-center item-center xl:text-lg px-4 rounded-lg text-sm font-medium text-[#E491C9] hover:underline"
            type="submit"
          >
            <img
              class="h-5 w-5 mr-2 xl:h-7 xl:w-7 xl:mr-4"
              src="images/google.png"
              alt=""
            />Sign in with Google
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
