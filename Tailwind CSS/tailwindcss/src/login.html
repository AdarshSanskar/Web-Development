<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-[#4f000b] flex justify-center items-center min-h-screen">
    <div class="bg-[#ff7f51] rounded-lg w-full max-w-sm px-8 py-16 shadow-2xl">
        <h1 class="text-[#720026] text-4xl font-bold text-center mb-8">Login</h1>
        <form class="flex flex-col">
            <div class="mb-4">
                <label class="text-lg font-medium text-[#720026]">Email</label>
                <input
                    class="block text-lg bg-[#ff9b54] w-full rounded-sm p-1 text-[#ce4257] focus:outline-none focus:ring-2"
                    type="email" name="" id="" placeholder="Email">
            </div>
            <div class="mb-6">
                <label class="text-lg font-medium text-[#720026]" for="">Password</label>
                <input
                    class="block text-lg bg-[#ff9b54] w-full rounded-sm p-1 text-[#ce4257] focus:outline-none focus:ring-2"
                    type="password" name="" id="" placeholder="Password">
            </div>
            <button
                class="text-lg bg-[#4f000b] rounded-sm p-1 text-[#ff7f51] font-medium hover:bg-[#ad2b3f] hover:cursor-pointer"
                type="submit">Login</button>
        </form>
    </div>
</body>

</html>
