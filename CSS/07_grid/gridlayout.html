<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another Grid Pattern</title>
    <style>
        .body {
            margin: 0;
            padding: 0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 200px 200px 200px 400px;
            gap: 5px;
        }

        /*.item {
            background-color: orange;
            border: 1px solid black;
        }*/

        .item1 {
            grid-row: 1/3;
        }

        .item3 {
            grid-row: 2/4;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item5 {
            grid-column: 1/3;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="item item1">
            <img src="/images/2024_lamborghini_revuelto_car_4k_5k_hd_cars-3840x2160.jpg">
        </div>
        <div class="item item2">
            <img src="/images/0uermbt9q8b61.png">
        </div>
        <div class="item item3">
            <img src="/images/209-2099015_ultra-hd-4k-supercar-wallpapers-hd-desktop-backgrounds.jpg">
        </div>
        <div class="item item4">
            <img src="/images/4k-bmw-4-series-x44p1lte1sjdpod1.jpg" alt="">
        </div>
        <div class="item item5">
            <img src="/images/4k-laptop-car-mansion-luxury-cars-bd3dmymq9p6u5qlz.jpg" alt="">
        </div>
    </div>
</body>

</html>
