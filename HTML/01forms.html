<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froms in HTML</title>
</head>
<body>
    <form>
        <!-- For a Radio Button to Work Properly, the 'name' Attribute Must Be the Same for All Options in the Group. -->
        <input type="radio" id="html" name="Language" value="HTML">
        <label for="html">HTML</label> <br>

        <input type="radio" id="css", name="Language" value="CSS">
        <label for="css">CSS</label> <br>

        <input type="radio" name="Language" id="js" value="JS">
        <label for="js">JS</label> <br>
    </form>
</body>
</html>
