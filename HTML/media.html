<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <h1>This is Media Learning</h1>
    <img
      src="./images/Logo.png"
      title="Adarsh"
      width="200px"
      alt="Profile Photo"
    />
    <p>Adarsh Santosh Tile</p>

    <h3>This is using Figure Tag</h3>

    <figure>
      <img src="./images/Logo.png" alt="This is a Logo" width="200px" />
      <figcaption>This is a Purple Color Logo</figcaption>
    </figure>

    <video src="./images/Dr. Strange effect.mp4" width="500px" controls></video>
  </body>
</html>
